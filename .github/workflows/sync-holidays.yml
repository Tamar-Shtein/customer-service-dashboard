name: Sync holidays (Hebcal API)

# Bonus: an external public API. Holidays change rarely, so once a day is
# plenty (cadence = the slowest that still serves the person waiting).
# No token needed - Hebcal is a free public API.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read upcoming holidays from Hebcal
        run: python scripts/fetch_holidays.py

      - name: Commit if the data changed
        run: |
          git config user.name "holidays-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/holidays.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Sync holidays from Hebcal"
          git pull --rebase
          git push
