name: Sync from Airtable

# Pulls the tickets from Airtable into data/tickets.json.
# Cadence: every hour (service reps check open tickets during the day),
# plus a manual "Run workflow" button for when you want it right now.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read tickets from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}      # Settings -> Secrets (never in code)
          AIRTABLE_BASE_ID: ${{ vars.AIRTABLE_BASE_ID }}     # Settings -> Variables (not secret)
        run: python scripts/fetch_airtable.py

      - name: Commit if the data changed
        run: |
          git config user.name "airtable-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/tickets.json
          git diff --cached --quiet && echo "No changes in Airtable." && exit 0
          git commit -m "Sync tickets from Airtable"
          git push
