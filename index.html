<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דאשבורד שירות לקוחות</title>
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --head: #f1f4f9;
    --accent: #3b6fd8;
    --open: #e5534b;
    --progress: #e0a526;
    --closed: #2e9e5b;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171f;
      --surface: #1d212b;
      --text: #e8eaf0;
      --muted: #9aa1ae;
      --border: #2d3240;
      --head: #252a36;
      --accent: #6b97ef;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; }
  .subtitle { color: var(--muted); font-size: 14px; }
  h2 { margin: 0 0 14px; font-size: 17px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }

  /* מדדים */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .kpi-label { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .kpi-value { font-size: 30px; font-weight: 700; }
  .kpi-note { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* גרפים */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .pie-wrap { display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .pie { position: relative; width: 170px; height: 170px; border-radius: 50%; }
  .pie::after { content: ""; position: absolute; inset: 38px; background: var(--surface); border-radius: 50%; }
  .pie-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .pie-center b { font-size: 26px; }
  .pie-center span { font-size: 12px; color: var(--muted); }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  .bar-row { display: grid; grid-template-columns: 100px 1fr 32px; align-items: center; gap: 10px; margin: 14px 0; font-size: 14px; }
  .bar-track { background: var(--head); border-radius: 4px; height: 22px; }
  .bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
  .bar-num { font-weight: 600; text-align: left; }

  /* טבלה */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: center; }
  .filters input, .filters select {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px;
  }
  .filters input { flex: 1; min-width: 160px; }
  .count { color: var(--muted); font-size: 13px; margin-inline-start: auto; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: right; font-size: 14px; }
  th { background: var(--head); font-weight: 600; }
  tbody tr:hover { background: var(--head); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>דאשבורד שירות לקוחות</h1>
    <div class="subtitle" id="range"></div>
  </header>

  <section class="kpis">
    <div class="card"><div class="kpi-label">סך כל הפניות</div><div class="kpi-value" id="kpi-total"></div></div>
    <div class="card"><div class="kpi-label">פניות פתוחות</div><div class="kpi-value" id="kpi-open"></div><div class="kpi-note" id="kpi-open-note"></div></div>
    <div class="card"><div class="kpi-label">שיעור פניות שנסגרו</div><div class="kpi-value" id="kpi-closed-rate"></div><div class="kpi-note" id="kpi-closed-note"></div></div>
    <div class="card"><div class="kpi-label">סוג הפנייה הנפוץ ביותר</div><div class="kpi-value" id="kpi-top"></div><div class="kpi-note" id="kpi-top-note"></div></div>
  </section>

  <section class="charts">
    <div class="card">
      <h2>התפלגות לפי סטטוס טיפול</h2>
      <div class="pie-wrap">
        <div class="pie" id="pie"><div class="pie-center"><b id="pie-total"></b><span>פניות</span></div></div>
        <div id="pie-legend"></div>
      </div>
    </div>
    <div class="card">
      <h2>מספר פניות לפי סוג</h2>
      <div id="bars"></div>
    </div>
  </section>

  <section class="card">
    <h2>כל הפניות</h2>
    <div class="filters">
      <input id="search" type="search" placeholder="חיפוש לפי שם לקוח…">
      <select id="filter-status"><option value="all">כל הסטטוסים</option></select>
      <select id="filter-type"><option value="all">כל הסוגים</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>שם לקוח</th><th>תאריך</th><th>סוג פנייה</th><th>סטטוס טיפול</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
  // ===== הגדרות =====
  const TYPES = ["תמיכה טכנית", "חיוב", "מידע כללי", "תלונה"];
  const STATUSES = ["פתוחה", "בטיפול", "נסגרה"];
  const STATUS_COLORS = { "פתוחה": "var(--open)", "בטיפול": "var(--progress)", "נסגרה": "var(--closed)" };

  // ===== נתוני דמה: 30 פניות =====
  // מחולל מספרים אקראיים עם "זרע" קבוע, כדי שהנתונים יהיו זהים בכל טעינה
  function seededRandom(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = seededRandom(100);

  function pickWeighted(items, weights) {
    const total = weights.reduce((a, b) => a + b, 0);
    let r = rand() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weights[i];
      if (r < 0) return items[i];
    }
    return items[items.length - 1];
  }

  const NAMES = [
    "דנה לוי", "יוסי כהן", "מיכל אברהם", "אורי שמעוני", "נועה ברק",
    "תומר גולן", "שירה פרץ", "עמית רוזן", "ליאת בן דוד", "רון מזרחי",
    "הילה פרידמן", "איתי שגיא", "מאיה אלון", "גיא נחום", "רותם קפלן",
    "אביגיל דהן", "עידו ויס", "יעל חדד", "אלון ביטון", "טל אזולאי"
  ];

  const TODAY = new Date(2026, 10, 14); // 14 בנובמבר 2026
  const DAYS_BACK = 45;

  function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  const data = [];
  for (let i = 0; i < 30; i++) {
    const age = Math.floor(rand() * DAYS_BACK); // כמה ימים עברו מאז הפנייה
    const date = new Date(TODAY);
    date.setDate(date.getDate() - age);

    // פניות ישנות יותר נוטות להיות סגורות, חדשות נוטות להיות פתוחות
    const statusWeights = age < 7 ? [5, 3, 1] : age < 20 ? [2, 4, 4] : [1, 2, 8];

    data.push({
      name: NAMES[Math.floor(rand() * NAMES.length)],
      date: formatDate(date),
      type: pickWeighted(TYPES, [10, 7, 5, 3]),
      status: pickWeighted(STATUSES, statusWeights)
    });
  }
  // מיון מהחדשה לישנה
  data.sort((a, b) => b.date.localeCompare(a.date));

  // ===== חישובים =====
  const countBy = (key, values) => {
    const c = {};
    values.forEach(v => c[v] = 0);
    data.forEach(d => c[d[key]]++);
    return c;
  };
  const statusCount = countBy("status", STATUSES);
  const typeCount = countBy("type", TYPES);
  const total = data.length;
  const pct = n => Math.round((n / total) * 100);

  // ===== מדדים =====
  const $ = id => document.getElementById(id);
  const [topType, topCount] = Object.entries(typeCount).sort((a, b) => b[1] - a[1])[0];

  $("range").textContent = `נתוני דמה · ${data[data.length - 1].date} עד ${data[0].date}`;
  $("kpi-total").textContent = total;
  $("kpi-open").textContent = statusCount["פתוחה"];
  $("kpi-open-note").textContent = `ועוד ${statusCount["בטיפול"]} בטיפול`;
  $("kpi-closed-rate").textContent = pct(statusCount["נסגרה"]) + "%";
  $("kpi-closed-note").textContent = `${statusCount["נסגרה"]} מתוך ${total} פניות`;
  $("kpi-top").textContent = topType;
  $("kpi-top-note").textContent = `${topCount} פניות (${pct(topCount)}%)`;

  // ===== גרף עוגה (דונאט) לפי סטטוס =====
  let start = 0;
  const slices = [];
  STATUSES.forEach(s => {
    const end = start + (statusCount[s] / total) * 100;
    slices.push(`${STATUS_COLORS[s]} ${start}% ${end}%`);
    start = end;
    $("pie-legend").insertAdjacentHTML("beforeend",
      `<div class="legend-item"><span class="swatch" style="background:${STATUS_COLORS[s]}"></span>
       ${s}: <b>${statusCount[s]}</b> (${pct(statusCount[s])}%)</div>`);
  });
  $("pie").style.background = `conic-gradient(${slices.join(", ")})`;
  $("pie-total").textContent = total;

  // ===== גרף עמודות לפי סוג פנייה =====
  const maxType = Math.max(...Object.values(typeCount));
  TYPES.slice().sort((a, b) => typeCount[b] - typeCount[a]).forEach(t => {
    $("bars").insertAdjacentHTML("beforeend",
      `<div class="bar-row">
         <span>${t}</span>
         <div class="bar-track"><div class="bar" style="width:${(typeCount[t] / maxType) * 100}%"></div></div>
         <span class="bar-num">${typeCount[t]}</span>
       </div>`);
  });

  // ===== טבלה עם סינון וחיפוש =====
  STATUSES.forEach(s => $("filter-status").insertAdjacentHTML("beforeend", `<option>${s}</option>`));
  TYPES.forEach(t => $("filter-type").insertAdjacentHTML("beforeend", `<option>${t}</option>`));

  function renderRows() {
    const q = $("search").value.trim();
    const status = $("filter-status").value;
    const type = $("filter-type").value;
    const rows = data.filter(d =>
      (status === "all" || d.status === status) &&
      (type === "all" || d.type === type) &&
      (q === "" || d.name.includes(q))
    );
    $("rows").innerHTML = rows.length
      ? rows.map(d => `<tr>
          <td>${d.name}</td>
          <td>${d.date}</td>
          <td>${d.type}</td>
          <td><span class="badge" style="background:${STATUS_COLORS[d.status]}">${d.status}</span></td>
        </tr>`).join("")
      : `<tr><td colspan="4" class="empty">לא נמצאו פניות התואמות לסינון</td></tr>`;
    $("count").textContent = `מציג ${rows.length} מתוך ${total}`;
  }
  ["search", "filter-status", "filter-type"].forEach(id => $(id).addEventListener("input", renderRows));
  renderRows();
</script>
</body>
</html>
